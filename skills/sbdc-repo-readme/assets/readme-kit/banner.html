<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
@page{size:1280px 440px;margin:0}
body{background:#002d62;color:#fff;height:440px;position:relative;overflow:hidden}
.glow{position:absolute;top:-220px;right:-180px;width:900px;height:620px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(209,17,66,.42),rgba(209,17,66,0))}
.glow2{position:absolute;bottom:-300px;left:-200px;width:700px;height:500px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(120,170,230,.16),rgba(120,170,230,0))}
.wrap{position:relative;padding:64px 80px 0}
.band{display:inline-block;background:#d11142;color:#fff;font-family:Archivo;font-weight:900;letter-spacing:.16em;
  text-transform:uppercase;font-size:14px;padding:6px 14px;border-radius:3px}
h1{color:#fff;font-weight:900;font-size:78px;letter-spacing:-.025em;margin:22px 0 0}
.rule{margin:20px 0 0;width:72px;height:5px}
.sub{color:#c6d4e6;font-size:24px;line-height:1.4;margin:20px 0 0;width:860px}
.sub b{color:#fff}
.meta{position:absolute;left:80px;right:80px;bottom:44px;display:flex;gap:14px}
.m{font-family:Archivo;font-weight:700;font-size:15px;color:#fff;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);border-radius:999px;padding:7px 16px}
.m.hi{background:#fff;color:#002d62;border-color:#fff}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <span class="band">Maryland SBDC · Open toolkit</span>
  <h1>SBDC Toolkit</h1>
  <div class="rule"></div>
  <p class="sub"><b>Fifteen AI skills for small business advising.</b> Client meeting in, follow-up email and file note out — in the chat you already use.</p>
</div>
<div class="meta">
  <span class="m hi">In use by SBDCs in 7 states</span>
  <span class="m">ChatGPT</span><span class="m">Claude</span><span class="m">Claude Code</span><span class="m">MIT licensed</span>
</div>
</body></html>
